# Runs the full hello-world benchmark on every push to main / PR, and on
# demand via workflow_dispatch (with tunable duration/connections).
#
# GitHub-hosted runners are small, shared VMs and the load generator runs on
# the same machine as the server, so treat CI numbers as smoke/regression
# signals — real comparisons belong on dedicated hardware.
name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      duration:
        description: "Measured seconds per server"
        default: "15"
      connections:
        description: "Concurrent connections"
        default: "64"

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dune (with package management)
        run: |
          curl -fsSL https://get.dune.build/install | sh
          echo "$HOME/.dune/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show dune version
        run: dune --version

      - name: Install load generator (wrk)
        run: |
          sudo apt-get update
          sudo apt-get install -y wrk

      # Each server locks and builds its own dependency universe; cache the
      # dune package/build cache and the per-server locks so only the first
      # run pays for compiler + library builds.
      - name: Cache dune packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/dune
            servers/*/dune.lock
          key: dune-pkg-${{ runner.os }}-${{ hashFiles('servers/*/dune-project') }}
          restore-keys: |
            dune-pkg-${{ runner.os }}-

      - name: Run benchmark
        run: |
          python3 bench.py --fail-on-error --tool wrk \
            --duration "${{ github.event.inputs.duration || '15' }}" \
            --connections "${{ github.event.inputs.connections || '64' }}"

      - name: Publish summary
        if: always()
        run: |
          latest=$(ls -td results/*/ 2>/dev/null | head -1)
          if [ -n "$latest" ]; then
            {
              echo "## Benchmark results"
              echo
              echo "> Shared CI runner; load generator and servers share the machine."
              echo "> Use for regressions and smoke checks, not absolute comparisons."
              echo
              cat "$latest/results.md"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: results/
          if-no-files-found: ignore
